databaseChangeLog:
  - changeSet:
      id: 0
      author: admin
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: integer
              - column:
                  name: amount
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar
              - column:
                  name: status
                  type: varchar
