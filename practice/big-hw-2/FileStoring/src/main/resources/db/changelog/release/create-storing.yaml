databaseChangeLog:
  - changeSet:
      id: 1748121518937-1
      author: admin
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: file
                  type: bytea
              - column:
                  name: name
                  type: varchar(255)
        - addDefaultValue:
            tableName: files
            columnName: id
            defaultValueComputed: gen_random_uuid()

