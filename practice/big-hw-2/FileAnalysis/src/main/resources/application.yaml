spring:
  application:
    name: antiplag-analysis
  datasource:
    url: jdbc:postgresql://pg-service:5432/antiplug
    username: admin
    password: passwd
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8081